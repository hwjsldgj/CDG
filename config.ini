# ============================================================
# 恐龙跑酷游戏 - 完整配置文件
# 修改后重启游戏生效，若文件缺失或某参数未定义，程序使用内置默认值
# ============================================================

# ---------- 功能开关 ----------
[General]
ENABLE_BOOST=1
ENABLE_LINEAR_SPEED=1
ENABLE_HOLD_JUMP=1
ENABLE_OBSTACLES=1
ENABLE_COLLISION=1
ENABLE_SCORING=1

# ---------- 屏幕与布局 ----------
[Display]
SCREEN_WIDTH=80
SCREEN_HEIGHT=25
GROUND_Y=10
DINO_X=5
PLATFORM_WIDTH=1

# ---------- 物理参数 ----------
[Physics]
BASE_SPEED=0.5
MAX_SPEED=1.5
SPEED_PER_SCORE=0.0004
GRAVITY=0.05
JUMP_VEL_MAX=-0.42
MIN_GAP=8
MAX_GAP=40
COLLISION_DIST_THRESHOLD=1.0

# ---------- 速度倍增 ----------
[Boost]
BOOST_INTERVAL=20.0
BOOST_FACTOR=1.15
INITIAL_BOOST_TIME=20.0

# ---------- 时间与帧率 ----------
[Timing]
PHYSICS_DT=0.0166667
TARGET_FPS=120.0
SCORE_INTERVAL=0.1
REPLAY_FRAME_INTERVAL=0.033333    # 回放帧间隔（秒），对应录制帧率约30fps

# ---------- 跳跃钳位 ----------
[JumpClamp]
JUMP_TOP_CLAMP=4.0
JUMP_BOTTOM_CLAMP=2.0

# ---------- 障碍物生成 ----------
[ObstacleGen]
GENERATE_THRESHOLD=10.0
INITIAL_PLATFORM_OFFSET=5.0
MAX_PLATFORMS=200
MAX_GAP_GROWTH_INTERVAL=20.0
MAX_GAP_GROWTH_STEP=0.15
MAX_GAP_MULTIPLIER_MAX=2.0

# ---------- 键位映射 ----------
[Keys]
JUMP_KEY=32
PAUSE_KEY=80
RESTART_KEY=82
CONFIRM_KEY=13
CANCEL_KEY=27
NAV_UP_KEY=38
NAV_DOWN_KEY=40
EXIT_CONFIRM_KEY=89
EXIT_DENY_KEY=78
JUMP_KEY_NAME=空格
PAUSE_KEY_NAME=P
RESTART_KEY_NAME=R
CANCEL_KEY_NAME=ESC
NAV_UP_KEY_NAME=↑
NAV_DOWN_KEY_NAME=↓

# ---------- 主菜单 ----------
[Menu]
menu_title===== 小恐龙 =====
menu_subtitle=(Dino Run)
menu_hint=↑ ↓ 选择  Enter 确认  数字键快速选择 (小键盘支持)
item_1=开始游戏|start_game
item_2=最高分记录|show_highscore
item_3=历史记录|show_history
item_4=回放|show_replay
item_5=退出游戏|exit

# ---------- 暂停菜单 ----------
[Pause]
pause_title=⏸ 游戏暂停
pause_hint=↑ ↓ 选择  Enter 确认  数字键 1/2/3 快速选择
pause_item_1=继续游戏|resume
pause_item_2=重新开始|restart
pause_item_3=返回主菜单|back_to_menu

# ---------- 游戏结束 ----------
[GameOver]
gameover_title=游戏结束！
gameover_restart_hint=按 %KEY_RESTART% 重新开始  |  %KEY_CANCEL% 返回主菜单

# ---------- 最高分页面 ----------
[HighScorePage]
highscore_title===== 最高分记录 ===
highscore_hint=按任意键返回主菜单

# ---------- 显示文本 ----------
[DisplayText]
score_prefix=得分：
highscore_prefix=最高分：
highscore_none=暂无记录