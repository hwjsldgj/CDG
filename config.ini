# ============================================================
# 恐龙跑酷游戏 - 完整配置文件
# 修改后重启游戏生效，若文件缺失或某参数未定义，程序使用内置默认值
# ============================================================

# ---------- 功能开关 ----------
[General]
# 启用速度倍增（每 BOOST_INTERVAL 秒乘以 BOOST_FACTOR）
ENABLE_BOOST=1
# 启用线性速度增长（每分增加 SPEED_PER_SCORE）
ENABLE_LINEAR_SPEED=1
# 启用长按跳跃保持最大速度（按住跳跃键持续上升）
ENABLE_HOLD_JUMP=1
# 启用障碍物生成（关闭则无障碍）
ENABLE_OBSTACLES=1
# 启用碰撞检测（关闭则无敌）
ENABLE_COLLISION=1
# 启用计分（关闭则分数不增长）
ENABLE_SCORING=1

# ---------- 屏幕与布局 ----------
[Display]
# 控制台窗口宽度（列）
SCREEN_WIDTH=80
# 控制台窗口高度（行）
SCREEN_HEIGHT=25
# 地面所在的纵坐标（行，0-based）
GROUND_Y=10
# 恐龙固定的横坐标（列）
DINO_X=5
# 每个障碍物的宽度（格）
PLATFORM_WIDTH=1

# ---------- 物理参数 ----------
[Physics]
# 基础移动速度（格/帧，60Hz下约为30格/秒）
BASE_SPEED=0.5
# 速度上限，防止后期速度过快
MAX_SPEED=1.5
# 每得分增加的速度增量（每1分增加0.0004格/帧）
SPEED_PER_SCORE=0.0004
# 重力加速度（每帧速度增量）
GRAVITY=0.05
# 起跳初速度（负值表示向上）
JUMP_VEL_MAX=-0.42
# 障碍物之间的最小间距（格）
MIN_GAP=8
# 障碍物之间的最大间距（格）
MAX_GAP=40
# 碰撞检测的水平距离阈值（格，小于此值判定碰撞）
COLLISION_DIST_THRESHOLD=1.0

# ---------- 速度倍增 ----------
[Boost]
# 速度倍增的间隔时间（秒）
BOOST_INTERVAL=20.0
# 每次倍增的倍数（例如 1.15 表示增加 15%）
BOOST_FACTOR=1.15
# 游戏开始后第一次倍增的触发时间（秒）
INITIAL_BOOST_TIME=20.0

# ---------- 时间与帧率 ----------
[Timing]
# 物理更新步长（秒，通常为 1/60）
PHYSICS_DT=0.0166667
# 目标渲染帧率（帧/秒）
TARGET_FPS=120.0
# 计分间隔（秒，每过此时间加1分）
SCORE_INTERVAL=0.1

# ---------- 跳跃钳位 ----------
[JumpClamp]
# 跳跃上升时，恐龙高度小于此值开始减速（顶部缓冲区）
JUMP_TOP_CLAMP=4.0
# 跳跃时恐龙最低高度（防止穿顶）
JUMP_BOTTOM_CLAMP=2.0

# ---------- 障碍物生成 ----------
[ObstacleGen]
# 最后一个障碍物右边界距屏幕右端至少多少格时才生成新障碍
GENERATE_THRESHOLD=10.0
# 初始障碍物距屏幕右端的偏移量
INITIAL_PLATFORM_OFFSET=5.0
# 最大障碍物数量（防溢出）
MAX_PLATFORMS=200

# ---------- 键位映射（使用Windows虚拟键码十进制） ----------
[Keys]
# 常用虚拟键码参考：
# 空格=32, 回车=13, ESC=27, 上=38, 下=40
# P=80, R=82, Y=89, N=78
# 字母键用大写ASCII码（如 A=65）
#
# 跳跃键（默认空格）
JUMP_KEY=32
# 暂停键（默认P）
PAUSE_KEY=80
# 重新开始键（默认R）
RESTART_KEY=82
# 确认键（默认回车）
CONFIRM_KEY=13
# 取消键（默认ESC）
CANCEL_KEY=27
# 导航上键（默认上箭头）
NAV_UP_KEY=38
# 导航下键（默认下箭头）
NAV_DOWN_KEY=40
# 退出确认键（默认Y）
EXIT_CONFIRM_KEY=89
# 退出取消键（默认N）
EXIT_DENY_KEY=78

# 键位显示名称（用于界面提示文字，可自由修改）
JUMP_KEY_NAME=空格
PAUSE_KEY_NAME=P
RESTART_KEY_NAME=R
CANCEL_KEY_NAME=ESC
NAV_UP_KEY_NAME=↑
NAV_DOWN_KEY_NAME=↓

# ---------- 主菜单文字 ----------
[Menu]
# 主菜单标题
menu_title===== 恐龙跑酷 ===
# 主菜单副标题
menu_subtitle=(Dino Run)
# 主菜单操作提示（支持键位占位符：%KEY_NAV_UP%, %KEY_NAV_DOWN% 等）
menu_hint=↑ ↓ 选择  Enter 确认  数字键快速选择 (小键盘支持)
# 菜单项（格式：显示名称|动作标识）
# 动作标识：start_game（开始游戏）, show_highscore（最高分记录）, exit（退出）
item_1=开始游戏|start_game
item_2=最高分记录|show_highscore
item_3=退出游戏|exit

# ---------- 暂停菜单文字 ----------
[Pause]
pause_title=⏸ 游戏暂停
pause_hint=↑ ↓ 选择  Enter 确认  数字键 1/2/3 快速选择
# 暂停项（格式：显示名称|动作标识）
# 动作标识：resume（继续）, restart（重新开始）, back_to_menu（返回主菜单）
pause_item_1=继续游戏|resume
pause_item_2=重新开始|restart
pause_item_3=返回主菜单|back_to_menu

# ---------- 游戏结束文字 ----------
[GameOver]
gameover_title=游戏结束！
# 支持键位占位符：%KEY_RESTART%, %KEY_CANCEL%
gameover_restart_hint=按 %KEY_RESTART% 重新开始  |  %KEY_CANCEL% 返回主菜单

# ---------- 最高分页面文字 ----------
[HighScorePage]
highscore_title===== 最高分记录 ===
highscore_hint=按任意键返回主菜单

# ---------- 显示文本 ----------
[DisplayText]
# 得分前缀
score_prefix=得分：
# 最高分前缀
highscore_prefix=最高分：
# 暂无最高分记录时的显示文字
highscore_none=暂无记录