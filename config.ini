# ============================================================
# 恐龙跑酷游戏配置文件
# 修改后无需重新编译，重启游戏即生效
# 若文件缺失或某参数未定义，程序将使用内置默认值
# ============================================================

# ---------- 功能开关 ----------
# 启用速度倍增（每 BOOST_INTERVAL 秒乘以 BOOST_FACTOR）
ENABLE_BOOST=1
# 启用线性速度增长（每分增加 SPEED_PER_SCORE）
ENABLE_LINEAR_SPEED=1
# 启用长按跳跃保持最大速度（按住空格持续上升）
ENABLE_HOLD_JUMP=1
# 启用障碍物生成（关闭则无障碍）
ENABLE_OBSTACLES=1
# 启用碰撞检测（关闭则无敌）
ENABLE_COLLISION=1
# 启用计分（关闭则分数不增长）
ENABLE_SCORING=1

# ---------- 屏幕与布局 ----------
# 控制台窗口宽度（列）
SCREEN_WIDTH=80
# 控制台窗口高度（行）
SCREEN_HEIGHT=25
# 地面所在的纵坐标（行，0-based）
GROUND_Y=10
# 恐龙固定的横坐标（列）
DINO_X=5
# 每个障碍物的宽度（格）
PLATFORM_WIDTH=1

# ---------- 物理与速度 ----------
# 基础移动速度（格/帧，60Hz下约为30格/秒）
BASE_SPEED=0.5
# 速度上限，防止后期速度过快
MAX_SPEED=1.5
# 每得分增加的速度增量（每1分增加0.0004格/帧）
SPEED_PER_SCORE=0.0004
# 重力加速度（每帧速度增量）
GRAVITY=0.05
# 起跳初速度（负值表示向上）
JUMP_VEL_MAX=-0.42
# 障碍物之间的最小间距（格）
MIN_GAP=8
# 障碍物之间的最大间距（格）
MAX_GAP=40
# 碰撞检测的水平距离阈值（格，小于此值判定碰撞）
COLLISION_DIST_THRESHOLD=1.0

# ---------- 速度倍增机制 ----------
# 速度倍增的间隔时间（秒）
BOOST_INTERVAL=20.0
# 每次倍增的倍数（例如 1.15 表示增加 15%）
BOOST_FACTOR=1.15
# 游戏开始后第一次倍增的触发时间（秒）
INITIAL_BOOST_TIME=20.0

# ---------- 时间与帧率 ----------
# 物理更新步长（秒，通常为 1/60）
PHYSICS_DT=0.0166667
# 目标渲染帧率（帧/秒）
TARGET_FPS=120.0
# 计分间隔（秒，每过此时间加1分）
SCORE_INTERVAL=0.1

# ---------- 跳跃钳位 ----------
# 跳跃上升时，恐龙高度小于此值开始减速（顶部缓冲区）
JUMP_TOP_CLAMP=4.0
# 跳跃时恐龙最低高度（防止穿顶）
JUMP_BOTTOM_CLAMP=2.0

# ---------- 障碍物生成 ----------
# 最后一个障碍物右边界距屏幕右端至少多少格时才生成新障碍
GENERATE_THRESHOLD=10.0
# 初始障碍物距屏幕右端的偏移量
INITIAL_PLATFORM_OFFSET=5.0